</head>
<body>

            </div>
        </div>

        <!-- Правая колонка: Маленькая таблица мирового рейтинга -->

            <h3>🏆 Топ-20 PvP Игроков</h3>

    <!-- Подключаем скрипт с актуальными данными игроков -->
    <script src="script.js"></script>
