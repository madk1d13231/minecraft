    <!-- Подключаем Chart.js для графиков онлайна -->

    <style>
        body {
            background-color: #0b0f15;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Фон сакуры (уменьшенный) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 350px;
            background-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=90&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center 30%;
            transform: scale(0.9);
            transform-origin: top center;
            filter: saturate(1.3) brightness(0.9) contrast(1.1);
            opacity: 0.5;
            z-index: -1;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        /* Контейнер для падающих лепестков сакуры */
        .sakura-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Увеличенные лепестки сакуры */
        .petal {
            position: absolute;
            top: -30px;
            width: 18px;
            height: 12px;
            background: linear-gradient(135deg, #ffb7c5 0%, #ff69b4 100%);
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            animation: sakura-fall linear infinite;
            transform: rotate(45deg);
        }

        @keyframes sakura-fall {
            0% {
                transform: translateY(-30px) translateX(0) rotate(0deg);
                opacity: 0.9;
            }
            50% {
                transform: translateY(50vh) translateX(40px) rotate(180deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(105vh) translateX(-30px) rotate(360deg);
                opacity: 0;
            }
        }

        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        
        .top-panel-bar {

        }
        .nav-tabs {
            display: flex; gap: 10px; border-bottom: 1px solid #30363d; padding-bottom: 10px; flex-wrap: wrap;

        .nav-tab-btn {

            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s;
        }
        .nav-tab-btn.active { background: #1f6feb; color: white; border-color: #388bfd; }

        .lang-switch {

            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 950px) {
            .main-layout { grid-template-columns: 1fr; }

        .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
