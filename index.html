<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг серверов Minecraft</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 280px;
            background-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: top center;
            filter: blur(4px);
            opacity: 0.4;
            z-index: -1;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 950px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card { background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; backdrop-filter: blur(5px); cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
        .card.vip-card { border-color: #f0883e; box-shadow: 0 0 10px rgba(240, 136, 62, 0.2); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h3 { margin: 0; color: #58a6ff; }
        p { margin: 4px 0; font-size: 14px; }
        .desc { color: #8b949e; font-size: 13px; margin-top: 8px; }
        .badge { background: #21262d; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .rating-star { color: #f0883e; font-weight: bold; }
        
        /* Строка поиска */
        .search-bar {
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            backdrop-filter: blur(5px);
        }
        .search-input:focus { border-color: #58a6ff; }

        /* Сетка категорий режимов */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 20px 0 10px 0;
        }
        .cat-card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-card:hover {
            border-color: #58a6ff;
            background: rgba(31, 36, 44, 0.95);
            transform: translateY(-2px);
        }
        .cat-icon { font-size: 24px; margin-bottom: 4px; }
        .cat-title { font-size: 13px; font-weight: bold; color: #58a6ff; }
        
        /* Панель фильтров по регионам */
        .regions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .region-btn {
            background: rgba(22, 27, 34, 0.85);
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .region-btn:hover {
            border-color: #58a6ff;
            color: #c9d1d9;
        }

        .filter-buttons { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .btn-reset { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-reset:hover { background: #30363d; }
        
        .admin-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-add { background: #238636; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; }
        .btn-add:hover { background: #2ea043; }
        .btn-admin-top { background: #1f6feb; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; }
        .btn-admin-top:hover { background: #388bfd; }

        /* Боковая панель */
        .sidebar-container { display: flex; flex-direction: column; gap: 15px; }
        .sidebar-panel {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(5px);
            max-height: 800px;
            overflow-y: auto;
        }
        .sidebar-title { font-size: 15px; font-weight: bold; color: #f0883e; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; position: sticky; top: 0; background: rgba(22, 27, 34, 0.95); padding-bottom: 6px; z-index: 2; }
        
        /* Карточки лидеров с тирами */
        .leader-card-item {
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .leader-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .leader-rank-num { color: #8b949e; }
        .leader-rank-num.top1 { color: #ffd700; }
        .leader-rank-num.top2 { color: #c0c0c0; }
        .leader-rank-num.top3 { color: #cd7f32; }
        
        .tier-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .mini-tier {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 11px;
            color: #c9d1d9;
        }
        .mini-tier span { color: #58a6ff; font-weight: bold; }

        /* Отзывы */
        .reviews-section { margin-top: 12px; border-top: 1px solid #30363d; padding-top: 10px; }
        .review-item { background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 13px; position: relative; }
        .review-form { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
        .review-form input, .review-form select, .review-form button { padding: 6px 10px; border-radius: 4px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 13px; }
        .review-form input { flex: 1; min-width: 100px; }
        .review-form button { background: #238636; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; justify-content: center; align-items: center;
            z-index: 10000; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            width: 90%; max-width: 600px; padding: 25px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: transparent;
            border: none; color: #8b949e; font-size: 20px; cursor: pointer;
        }
        .modal-close:hover { color: #c9d1d9; }
        .modal-links {
            display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;
        }
        .modal-btn-link {
            background: #21262d; color: #58a6ff; border: 1px solid #30363d;
            padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold;
        }
        .modal-btn-link:hover { background: #30363d; }
        
        #admin-btn { position: fixed; bottom: 15px; left: 15px; background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; cursor: pointer; z-index: 9999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 Мировой мониторинг серверов Minecraft</h1>
        <p style="color: #8b949e;">Лучшие сервера со всего мира, отзывы и топ-20 PvP бойцов</p>

        <!-- Строка поиска -->
        <div class="search-bar" style="margin-top: 15px;">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Найти сервер по названию или IP..." oninput="handleSearch()">
        </div>

        <!-- Категории режимов -->
        <div class="categories-grid">
            <div class="cat-card" onclick="filterByMode('Анархия')">
                <div class="cat-icon">🔥</div>
                <div class="cat-title">Анархия</div>
            </div>
            <div class="cat-card" onclick="filterByMode('PvP')">
                <div class="cat-icon">⚔️</div>
                <div class="cat-title">PvP / Дуэли</div>
            </div>
            <div class="cat-card" onclick="filterByMode('Выживание')">
                <div class="cat-icon">🏡</div>
                <div class="cat-title">Выживание</div>
            </div>
            <div class="cat-card" onclick="filterByMode('BedWars')">
                <div class="cat-icon">🛏️</div>
                <div class="cat-title">BedWars</div>
            </div>
        </div>

        <!-- Фильтры по регионам -->
        <div class="regions-bar">
            <span style="font-size: 13px; color: #8b949e; font-weight: bold;">Регионы:</span>
            <button class="region-btn" onclick="filterByRegion('СНГ')">🇷🇺 СНГ</button>
            <button class="region-btn" onclick="filterByRegion('США')">🇺🇸 США / Америка</button>
            <button class="region-btn" onclick="filterByRegion('Европа')">🇪🇺 Европа</button>
            <button class="region-btn" onclick="filterByRegion('Азия')">🌏 Азия</button>
        </div>

        <div class="filter-buttons">
            <button class="btn-reset" onclick="resetFilter()">Сбросить фильтры (Показать все)</button>
            <div class="admin-controls">
                <button id="admin-top-btn" class="btn-admin-top" onclick="manageTop()">🏆 Управление топом</button>
                <button id="add-server-btn" class="btn-add" onclick="addNewServer()">➕ Добавить сервер</button>
            </div>
        </div>

        <!-- Основной контент + Боковая колонка -->
        <div class="main-layout">
            <div id="server-list"></div>

            <!-- Боковая панель с топом из 20 игроков -->
            <div class="sidebar-container">
                <div class="sidebar-panel">
                    <div class="sidebar-title">🏆 Топ-20 PvP Игроков</div>
                    <div id="leaderboard-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно с деталями сервера -->
    <div id="serverModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" id="modalContentBox">
            <button class="modal-close" onclick="closeModalDirect()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <button id="admin-btn" onclick="checkAdmin()">⚙️ Админ</button>

    <script>
        const PASSWORD = "qwe12345tyu124";
        let isAdmin = false;

        let defaultServers = [
            { id: "hypixel", name: "Hypixel", ip: "play.hypixel.net", region: "СНГ", flag: "🇺🇸", rating: 5.0, online: 48500, mode: "BedWars", desc: "Главный мировой сервер с огромным онлайном и мини-играми.", status: "🟢 Работает", vip: true, wipe: "Каждый понедельник", discord: "https://discord.gg/hypixel", store: "https://store.hypixel.net" },
            { id: "skytime", name: "SkyTime", ip: "mc.skytime.su", region: "СНГ", flag: "🇷🇺", rating: 4.8, online: 2400, mode: "PvP", desc: "Популярный СНГ проект для тренировок, тренировочного PvP и дуэлей.", status: "🟢 Работает", vip: false, wipe: "1 раз в 3 месяца", discord: "https://discord.gg/skytime", store: "https://shop.skytime.su" },
            { id: "mcskill", name: "MCSkill", ip: "mc.mcraft.pro", region: "СНГ", flag: "🇷🇺", rating: 4.8, online: 1240, mode: "Выживание", desc: "Крупнейший СНГ проект с модами и мирным развитием.", status: "🟢 Работает", vip: false, wipe: "По мере необходимости", discord: "https://discord.gg/mcskill", store: "https://mcskill.net" },
            { id: "reallyworld", name: "Really World", ip: "mc.reallyworld.ru", region: "СНГ", flag: "🇷🇺", rating: 4.7, online: 3850, mode: "Анархия", desc: "Популярный гриферский сервер и анархия без приватов.", status: "🟢 Работает", vip: false, wipe: "Раз в месяц", discord: "https://discord.gg/reallyworld", store: "https://reallyworld.ru" },
            { id: "holyworld", name: "play.holyworld.ru", ip: "play.holyworld.ru", region: "СНГ", flag: "🇷🇺", rating: 4.7, online: 3100, mode: "Анархия", desc: "Суровая анархия с прокачкой и ежедневными ивентами.", status: "🟢 Работает", vip: false, wipe: "Раз в 1.5 месяца", discord: "https://discord.gg/holyworld", store: "https://holyworld.ru" },
            { id: "funtime", name: "FunTime", ip: "funtime.su", region: "СНГ", flag: "🇷🇺", rating: 4.6, online: 4200, mode: "Анархия", desc: "Один из самых известных анархических проектов СНГ.", status: "🟢 Работает", vip: false, wipe: "Раз в месяц", discord: "https://discord.gg/funtime", store: "https://funtime.su" }
        ];

        let defaultLeaders = [
            { rank: 1, name: "ItzRealMe", tiers: [{ kit: "Crystal", tier: "HT1" }, { kit: "Pot", tier: "HT1" }, { kit: "Mace", tier: "HT1" }] },
            { rank: 2, name: "Marlowww", tiers: [{ kit: "Crystal", tier: "HT1" }, { kit: "SMP", tier: "HT1" }, { kit: "Sword", tier: "HT1" }] },
            { rank: 3, name: "xX_Slayer_Xx", tiers: [{ kit: "Crystal", tier: "HT2" }, { kit: "Pot", tier: "HT1" }, { kit: "Axe", tier: "HT2" }] },
            { rank: 4, name: "ShadowPvP", tiers: [{ kit: "Pot", tier: "HT2" }, { kit: "Sword", tier: "HT2" }, { kit: "UHC", tier: "HT3" }] },
            { rank: 5, name: "KillauraGod", tiers: [{ kit: "Crystal", tier: "HT2" }, { kit: "Mace", tier: "HT2" }, { kit: "SMP", tier: "HT2" }] }
        ];

        let allServers = JSON.parse(localStorage.getItem('saved_servers')) || defaultServers;
        let pvpLeaders = JSON.parse(localStorage.getItem('saved_leaders')) || defaultLeaders;
        let currentActiveList = allServers;

        function saveServers() {
            localStorage.setItem('saved_servers', JSON.stringify(allServers));
        }

        function saveLeaders() {
            localStorage.setItem('saved_leaders', JSON.stringify(pvpLeaders));
        }

        function renderSidebar() {
            let lbContainer = document.getElementById("leaderboard-list");
            if (!lbContainer) return;

            lbContainer.innerHTML = pvpLeaders.map(item => {
                let rankClass = item.rank === 1 ? "top1" : item.rank === 2 ? "top2" : item.rank === 3 ? "top3" : "";
                let tiersHtml = item.tiers.map(t => `<div class="mini-tier">${t.kit}: <span>${t.tier}</span></div>`).join("");

                return `
                    <div class="leader-card-item">
                        <div class="leader-card-header">
                            <div>
                                <span class="leader-rank-num ${rankClass}">#${item.rank}</span> 
                                <span style="color: #58a6ff;">${item.name}</span>
                            </div>
                        </div>
                        <div class="tier-tags">
                            ${tiersHtml}
                        </div>
                    </div>
                `;
            }).join("");
        }

        function getReviews(serverId) {
            try {
                let data = localStorage.getItem('reviews_' + serverId);
                return data ? JSON.parse(data) : [];
            } catch(e) { return []; }
        }

        function addReview(serverId, event) {
            event.stopPropagation(); // Чтобы не открывалось модальное окно при клике на кнопку
            let nameInput = document.getElementById('name_' + serverId);
            let textInput = document.getElementById('text_' + serverId);
            let starSelect = document.getElementById('stars_' + serverId);

            let author = nameInput.value.trim() || "Игрок";
            let text = textInput.value.trim();
            let stars = parseInt(starSelect.value);

            if (!text) {
                alert("Напишите текст отзыва!");
                return;
            }

            let reviews = getReviews(serverId);
            reviews.unshift({ id: Date.now(), author, text, stars, date: new Date().toLocaleDateString() });
            localStorage.setItem('reviews_' + serverId, JSON.stringify(reviews));

            render(currentActiveList);
        }

        function deleteReview(serverId, reviewId, event) {
            event.stopPropagation();
            if (!isAdmin) return;
            let reviews = getReviews(serverId);
            reviews = reviews.filter(r => r.id !== reviewId);
            localStorage.setItem('reviews_' + serverId, JSON.stringify(reviews));
            render(currentActiveList);
        }

        function render(serversToRender) {
            currentActiveList = serversToRender;
            let list = document.getElementById("server-list");
            if (!list) return;
            
            let sorted = [...serversToRender].sort((a, b) => (b.vip === true) - (a.vip === true));

            if (sorted.length === 0) {
                list.innerHTML = '<p style="color: #8b949e; text-align: center; padding: 20px;">Серверы не найдены.</p>';
                return;
            }

            list.innerHTML = sorted.map(s => {
                let reviews = getReviews(s.id);
                let vipBadge = s.vip ? '<span class="badge" style="background: #f0883e; color: #0d1117; font-weight: bold;">👑 VIP</span>' : '';
                let adminPanel = isAdmin ? `
                    <div style="margin-top: 10px; display: flex; gap: 8px;">
                        <button onclick="event.stopPropagation(); editServer('${s.id}')" style="background: #238636; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">✏️ Изменить</button>
                        <button onclick="event.stopPropagation(); deleteServer('${s.id}')" style="background: #da3633; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">🗑️ Удалить</button>
                    </div>
                ` : '';

                return `
                    <div class="card ${s.vip ? 'vip-card' : ''}" onclick="openServerModal('${s.id}')">
                        <div class="header-flex">
                            <h3>${s.name} ${vipBadge}</h3>
                            <div>
                                <span class="rating-star">★ ${s.rating}</span>
                                <span class="badge">${s.status || '🟢 Работает'}</span>
                                <span class="badge">${s.flag} ${s.region}</span>
                                <span class="badge">${s.mode}</span>
                            </div>
                        </div>
                        <p><strong>IP:</strong> <code>${s.ip}</code></p>
                        <p><strong>Онлайн:</strong> 👥 ${s.online} игроков</p>
                        <p class="desc">${s.desc}</p>
                        ${adminPanel}

                        <div class="reviews-section" onclick="event.stopPropagation()">
                            <strong>💬 Отзывы (${reviews.length}):</strong>
                            <div class="review-form">
                                <input type="text" id="name_${s.id}" placeholder="Имя" maxlength="15">
                                <select id="stars_${s.id}">
                                    <option value="5">★ 5</option>
                                    <option value="4">★ 4</option>
                                    <option value="3">★ 3</option>
                                    <option value="2">★ 2</option>
                                    <option value="1">★ 1</option>
                                </select>
                                <input type="text" id="text_${s.id}" placeholder="Отзыв..." style="flex:2;">
                                <button onclick="addReview('${s.id}', event)">OK</button>
                            </div>
                            <div style="margin-top: 8px;">
                                ${reviews.length === 0 ? '<p style="color:#8b949e; font-size:12px; margin:4px 0;">Пока нет отзывов. Кликните на карточку для подробностей!</p>' : 
                                    reviews.map(r => `
                                        <div class="review-item">
                                            <div style="display:flex; justify-content:space-between; color:#8b949e; font-size:11px;">
                                                <span><strong>${r.author}</strong> (${'★'.repeat(r.stars)})</span>
                                                <span>${r.date}</span>
                                            </div>
                                            <div style="margin-top:4px;">${r.text}</div>
                                            ${isAdmin ? `<button onclick="deleteReview('${s.id}', ${r.id}, event)" style="position: absolute; top: 6px; right: 6px; background: #da3633; color: white; border: none; border-radius: 3px; font-size: 10px; cursor: pointer; padding: 2px 5px;">Удалить</button>` : ''}
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Логика поиска
        function handleSearch() {
            let query = document.getElementById("search-input").value.toLowerCase();
            let filtered = allServers.filter(s => 
                s.name.toLowerCase().includes(query) || s.ip.toLowerCase().includes(query)
            );
            render(filtered);
        }

        // Логика модального окна
        function openServerModal(id) {
            let s = allServers.find(item => item.id === id);
            if (!s) return;

            let modalBody = document.getElementById("modalBody");
            modalBody.innerHTML = `
                <h2 style="color: #58a6ff; margin-top: 0;">${s.name}</h2>
                <p><strong>Полный IP-адрес:</strong> <code style="background: #21262d; padding: 2px 6px; border-radius: 4px;">${s.ip}</code></p>
                <p><strong>Режим:</strong> ${s.mode}</p>
                <p><strong>Регион:</strong> ${s.flag} ${s.region}</p>
                <p><strong>Статус:</strong> ${s.status || '🟢 Работает'}</p>
                <p><strong>Последний вайп:</strong> ${s.wipe || 'Не указано'}</p>
                <p style="margin-top: 15px;"><strong>Описание:</strong></p>
                <p style="color: #8b949e; background: rgba(13,17,23,0.5); padding: 10px; border-radius: 6px;">${s.desc}</p>
                
                <div class="modal-links">
                    ${s.discord ? `<a href="${s.discord}" target="_blank" class="modal-btn-link">💬 Discord сервер</a>` : ''}
                    ${s.store ? `<a href="${s.store}" target="_blank" class="modal-btn-link">🛒 Магазин / Донат</a>` : ''}
                </div>
            `;
            document.getElementById("serverModal").style.display = "flex";
        }

        function closeModal(event) {
            if (event.target.id === "serverModal") {
                closeModalDirect();
            }
        }

        function closeModalDirect() {
            document.getElementById("serverModal").style.display = "none";
        }

        function filterByMode(modeName) {
            let filtered = allServers.filter(s => s.mode.toLowerCase().includes(modeName.toLowerCase()));
            render(filtered);
        }

        function filterByRegion(regionName) {
            let filtered = allServers.filter(s => s.region.toLowerCase().includes(regionName.toLowerCase()));
            render(filtered);
        }

        function resetFilter() {
            document.getElementById("search-input").value = "";
            render(allServers);
        }

        function checkAdmin() {
            let pass = prompt("Введите пароль администратора:");
            if (pass === PASSWORD) {
                isAdmin = true;
                document.getElementById("add-server-btn").style.display = "block";
                document.getElementById("admin-top-btn").style.display = "block";
                alert("Успешный вход в режим администратора!");
                render(currentActiveList);
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        function addNewServer() {
            let name = prompt("Название сервера:");
            if (!name) return;
            let ip = prompt("IP адрес сервера:");
            if (!ip) return;
            let region = prompt("Регион (СНГ, США, Европа, Азия):", "СНГ");
            let flag = prompt("Эмодзи флага:", "🇷🇺");
            let mode = prompt("Режим (Анархия, PvP, Выживание, BedWars):", "Выживание");
            let status = prompt("Статус (🟢 Работает, 🔴 Оффлайн, 🛠️ Техработы):", "🟢 Работает");
            let vipChoice = confirm("Закрепить сервер в топе как VIP? (ОК - Да, Отмена - Нет)");
            let wipe = prompt("Дата/периодичность вайпа:", "Раз в месяц");
            let discord = prompt("Ссылка на Discord:", "https://discord.gg/...");
            let store = prompt("Ссылка на магазин:", "https://...");
            let desc = prompt("Описание сервера:");

            let newServer = {
                id: 'serv_' + Date.now(),
                name, ip, region, flag, rating: 5.0, online: 100, mode, status, vip: vipChoice, wipe, discord, store, desc: desc || "Новый сервер"
            };

            allServers.push(newServer);
            saveServers();
            render(allServers);
        }

        function editServer(id) {
            let s = allServers.find(item => item.id === id);
            if (!s) return;
            let newName = prompt("Изменить название:", s.name);
            let newIp = prompt("Изменить IP:", s.ip);
            let newWipe = prompt("Изменить инфо о вайпе:", s.wipe || "Раз в месяц");
            let newDiscord = prompt("Ссылка на Discord:", s.discord || "");
            let newStore = prompt("Ссылка на магазин:", s.store || "");
            let newDesc = prompt("Изменить описание:", s.desc);

            if (newName) s.name = newName;
            if (newIp) s.ip = newIp;
            if (newWipe) s.wipe = newWipe;
            if (newDiscord !== null) s.discord = newDiscord;
            if (newStore !== null) s.store = newStore;
            if (newDesc) s.desc = newDesc;

            saveServers();
            render(currentActiveList);
        }

        function deleteServer(id) {
            if (confirm("Точно удалить этот сервер?")) {
                allServers = allServers.filter(s => s.id !== id);
                saveServers();
                render(allServers);
            }
        }

        function manageTop() {
            let action = prompt("Выберите действие с топом:\n1 - Добавить игрока\n2 - Удалить игрока по нику", "1");
            if (action === "1") {
                let name = prompt("Ник игрока:");
                if (!name) return;
                let rank = parseInt(prompt("Место в рейтинге (1-20):", pvpLeaders.length + 1));
                let kit = prompt("Основной кит (Crystal, Pot, UHC, BedWars):", "Crystal");
                let tier = prompt("Тир (HT1, HT2, HT3):", "HT1");

                pvpLeaders.push({
                    rank: rank || (pvpLeaders.length + 1),
                    name,
                    tiers: [{ kit, tier }]
                });
                saveLeaders();
                renderSidebar();
                alert("Игрок успешно добавлен в топ!");
            } else if (action === "2") {
                let nameToRemove = prompt("Введите ник игрока для удаления:");
                pvpLeaders = pvpLeaders.filter(p => p.name.toLowerCase() !== nameToRemove.toLowerCase());
                saveLeaders();
                renderSidebar();
                alert("Топ обновлен!");
            }
        }

        render(allServers);
        renderSidebar();
    </script>
</body>
</html>
