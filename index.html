<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг серверов Minecraft</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        h3 { margin: 0 0 8px 0; color: #58a6ff; }
        p { margin: 4px 0; font-size: 14px; }
        .desc { color: #8b949e; font-size: 13px; margin-top: 8px; }
        #admin-btn { position: fixed; bottom: 15px; left: 15px; background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; cursor: pointer; z-index: 9999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Мониторинг серверов Minecraft</h1>
        <p style="color: #8b949e;">Список лучших серверов со всего мира</p>
        <div id="server-list" style="margin-top: 20px;"></div>
    </div>

    <button id="admin-btn" onclick="checkAdmin()">⚙️ Админ</button>

    <script>
        const PASSWORD = "qwe12345tyu124";
        let allServers = [
            { name: "Hypixel", ip: "play.hypixel.net", region: "США", flag: "🇺🇸", rating: 5.0, online: 48500, mode: "BedWars", desc: "Главный мировой сервер с мини-играми." },
            { name: "MCSkill", ip: "mc.mcraft.pro", region: "СНГ", flag: "🇷🇺", rating: 4.8, online: 1240, mode: "Моды", desc: "Крупнейший проект с модами." },
            { name: "Really World", ip: "mc.reallyworld.ru", region: "СНГ", flag: "🇷🇺", rating: 4.7, online: 3850, mode: "Анархия", desc: "Популярный гриферский сервер." },
            { name: "HolyWorld", ip: "play.holyworld.ru", region: "СНГ", flag: "🇷🇺", rating: 4.7, online: 3100, mode: "Анархия", desc: "Суровая анархия с ивентами." }
        ];

        function render() {
            let list = document.getElementById("server-list");
            if (!list) return;
            
            list.innerHTML = allServers.map(s => `
                <div class="card">
                    <h3>${s.name} (${s.flag} ${s.region})</h3>
                    <p><strong>IP:</strong> ${s.ip}</p>
                    <p><strong>Режим:</strong> ${s.mode}</p>
                    <p><strong>Рейтинг:</strong> ★ ${s.rating} | <strong>Онлайн:</strong> ${s.online}</p>
                    <p class="desc">${s.desc}</p>
                </div>
            `).join("");
        }

        function checkAdmin() {
            let pass = prompt("Введите пароль администратора:");
            if (pass === PASSWORD) {
                alert("Успешный вход в режим администратора!");
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        render();
    </script>
</body>
</html>
