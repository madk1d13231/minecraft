        // Рендеринг списка серверов
        function renderServers() {
            const container = document.getElementById('server-list');
            container.innerHTML = '';

            let filtered = serversData.filter(s => {
                let matchMode = currentFilterMode ? s.mode === currentFilterMode : true;
                let matchRegion = currentFilterRegion ? s.region === currentFilterRegion : true;
                let matchSearch = currentSearchQuery ? (
                    s.name.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    s.ip.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    s.version.toLowerCase().includes(currentSearchQuery.toLowerCase())
                ) : true;
                return matchMode && matchRegion && matchSearch;
            });

            // VIP сервера всегда вверху
            filtered.sort((a, b) => (b.vip === true) - (a.vip === true));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center; color: #8b949e;">Серверы не найдены. Попробуйте изменить параметры поиска.</div>`;
                return;
            }

            filtered.forEach(s => {
                const card = document.createElement('div');
                card.className = s.vip ? 'card vip-card' : 'card';
                card.onclick = (e) => {
                    // Если клик не по кнопке копирования IP
                    if (!e.target.classList.contains('copy-btn')) {
                        openServerProfile(s.id);
                    }
                };

                card.innerHTML = `
                    <div class="header-flex">
                        <div style="display: flex; align-items: center; gap: 8px;">

                    <p style="color: #8b949e; font-size: 13px;">IP: <code style="color: #58a6ff; cursor: pointer;" title="Кликните чтобы скопировать" onclick="copyIp('${s.ip}')">${s.ip}</code></p>

            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        }

        function filterByRegion(region) {

        function resetFilter() {
            currentFilterMode = '';
            currentFilterRegion = '';

            const ctx = document.getElementById('serverOnlineChart').getContext('2d');
            if (onlineChartInstance) {
                onlineChartInstance.destroy();
            }
            onlineChartInstance = new Chart(ctx, {

                let rankClass = '';
                if (player.rank === 1) rankClass = 'top1';
                else if (player.rank === 2) rankClass = 'top2';
                else if (player.rank === 3) rankClass = 'top3';

                const item = document.createElement('div');
                item.className = 'leader-card-item';
                item.innerHTML = `
                    <div class="leader-card-header">
                        <span><strong class="leader-rank-num ${rankClass}">#${player.rank}</strong> ${player.name}</span>
                        <span style="color: #3fb950; font-size: 12px;">KDR: ${player.kdr}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; color: #8b949e; font-size: 12px;">
                        <span>Сервер: <strong style="color: #58a6ff;">${player.server}</strong></span>
                        <span>Убийств: <strong style="color: #c9d1d9;">${player.kills}</strong></span>

                list.appendChild(item);

            const list = document.getElementById('forum-topics-list');

            document.getElementById('stat-servers-count').textContent = serversData.length;

        }

        function checkAdmin() {
            const pass = prompt("Введите пароль администратора:");
            if (pass === "admin2026" || pass === "1234") {
                isAdmin = !isAdmin;
                if (isAdmin) {
                    document.getElementById('admin-btn').style.background = '#238636';
                    document.getElementById('admin-btn').textContent = '⚙️ Админ (ВКЛ)';
                    document.getElementById('add-server-btn').style.display = 'inline-block';
                    document.getElementById('admin-top-btn').style.display = 'inline-block';
                    document.getElementById('db-view-btn').style.display = 'inline-block';
                    document.getElementById('api-sync-btn').style.display = 'inline-block';
                    document.getElementById('admin-stats-box').style.display = 'block';
                } else {
                    document.getElementById('admin-btn').style.background = '#21262d';
                    document.getElementById('admin-btn').textContent = '⚙️ Админ';
                    document.getElementById('add-server-btn').style.display = 'none';
                    document.getElementById('admin-top-btn').style.display = 'none';
                    document.getElementById('db-view-btn').style.display = 'none';
                    document.getElementById('api-sync-btn').style.display = 'none';
                    document.getElementById('admin-stats-box').style.display = 'none';
                }
                renderServers();
            } else if (pass !== null) {
                alert("Неверный пароль администратора!");
            }
        }

        function openServerForm(serverObj = null) {
            const modal = document.getElementById('serverFormModal');

                document.getElementById('formModalTitle').textContent = 'Редактировать сервер';
                document.getElementById('edit-id').value = serverObj.id;
                document.getElementById('f-name').value = serverObj.name;
                document.getElementById('f-ip').value = serverObj.ip;
                document.getElementById('f-version').value = serverObj.version;
                document.getElementById('f-region').value = serverObj.region;
                document.getElementById('f-flag').value = serverObj.flag;
                document.getElementById('f-mode').value = serverObj.mode;
                document.getElementById('f-status').value = serverObj.status;
                document.getElementById('f-vip').value = serverObj.vip ? 'true' : 'false';
                document.getElementById('f-wipe').value = serverObj.wipe || '';
                document.getElementById('f-discord').value = serverObj.discord || '';
                document.getElementById('f-store').value = serverObj.store || '';
                document.getElementById('f-desc').value = serverObj.desc || '';
            } else {
                document.getElementById('formModalTitle').textContent = 'Добавить новый сервер';
                document.getElementById('serverEditForm').reset();
                document.getElementById('edit-id').value = '';
            }
        }

        function closeFormModalDirect() {
            document.getElementById('serverFormModal').style.display = 'none';
        }
        function closeFormModal(e) {
            if (e.target.id === 'serverFormModal') closeFormModalDirect();
        }

        function updateFlagSelect() {
            const reg = document.getElementById('f-region').value;
            const flagSel = document.getElementById('f-flag');
            if (reg === 'СНГ') flagSel.value = '🇷🇺';
            else if (reg === 'США') flagSel.value = '🇺🇸';
            else if (reg === 'Европа') flagSel.value = '🇪🇺';
            else if (reg === 'Азия') flagSel.value = '🌏';
        }

        function saveServerForm(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('f-name').value;
            const ip = document.getElementById('f-ip').value;
            const version = document.getElementById('f-version').value;
            const region = document.getElementById('f-region').value;
            const flag = document.getElementById('f-flag').value;
            const mode = document.getElementById('f-mode').value;
            const status = document.getElementById('f-status').value;
            const vip = document.getElementById('f-vip').value === 'true';
            const wipe = document.getElementById('f-wipe').value;
            const discord = document.getElementById('f-discord').value;
            const store = document.getElementById('f-store').value;
            const desc = document.getElementById('f-desc').value;

            if (id) {
                // Редактирование
                let s = serversData.find(item => item.id == id);
                if (s) {
                    s.name = name; s.ip = ip; s.version = version; s.region = region;
                    s.flag = flag; s.mode = mode; s.status = status; s.vip = vip;
                    s.wipe = wipe; s.discord = discord; s.store = store; s.desc = desc;
                }
            } else {
                // Создание нового
                const newServer = {
                    id: Date.now(),
                    name, ip, version, region, flag, mode, status, vip,
                    online: Math.floor(Math.random() * 1000) + 200,
                    maxOnline: 3000,
                    rating: (Math.random() * 0.8 + 4.2).toFixed(1),
                    wipe, discord, store, desc,
                    history: [150, 300, 450, 600, 800]
                };
                serversData.push(newServer);
            }

            closeFormModalDirect();
            renderServers();
        }

        function editServer(id) {
            const s = serversData.find(item => item.id === id);
            if (s) openServerForm(s);
        }

        function deleteServer(id) {
            if (confirm("Вы действительно хотите удалить этот сервер из мониторинга?")) {
                serversData = serversData.filter(s => s.id !== id);
                renderServers();
            }
        }

        // Модальное окно темы форума
        function openTopicModal() {
            document.getElementById('topicModal').style.display = 'flex';
        }
        function closeTopicModalDirect() {
            document.getElementById('topicModal').style.display = 'none';
        }
        function closeTopicModalEvent(e) {
            if (e.target.id === 'topicModal') closeTopicModalDirect();
        }

        function saveNewTopic(e) {
            e.preventDefault();
            const author = document.getElementById('t-author').value;
            const category = document.getElementById('t-category').value;
            const title = document.getElementById('t-title').value;
            const text = document.getElementById('t-text').value;

            const now = new Date();
            const dateStr = now.toLocaleDateString() + ', ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const newTopic = {
                id: Date.now(),
                author, category, title, text,
                date: dateStr,
                replies: 0
            };

            topicsData.unshift(newTopic);
            closeTopicModalDirect();
            renderTopics();
            switchTab('forum');
        }

        function viewTopic(id) {
            const t = topicsData.find(item => item.id === id);
            if (!t) return;
            const body = document.getElementById('topicViewBody');
            body.innerHTML = `
                <span class="badge" style="background: #1f6feb22; color: #58a6ff; margin-bottom: 8px; display: inline-block;">${t.category}</span>
                <h2 style="color: #58a6ff; margin-top: 0;">${t.title}</h2>
                <div style="display: flex; gap: 12px; color: #8b949e; font-size: 12px; margin-bottom: 15px;">
                    <span>👤 Автор: <strong>${t.author}</strong></span>
                    <span>🕒 ${t.date}</span>
                </div>
                <p style="background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; line-height: 1.5; color: #c9d1d9;">${t.text}</p>
                <button onclick="closeTopicViewDirect()" class="form-btn-save" style="background: #21262d; border: 1px solid #30363d; margin-top: 15px;">Назад к списку</button>
            `;
            document.getElementById('topicViewModal').style.display = 'flex';
        }

        function closeTopicViewDirect() {
            document.getElementById('topicViewModal').style.display = 'none';
        }
        function closeTopicViewEvent(e) {
            if (e.target.id === 'topicViewModal') closeTopicViewDirect();
        }

        // Управление БД и Синхронизация API
        function openDatabaseModal() {
            document.getElementById('databaseModal').style.display = 'flex';
        }
        function closeDatabaseModalDirect() {
            document.getElementById('databaseModal').style.display = 'none';
        }
        function closeDatabaseModalEvent(e) {
            if (e.target.id === 'databaseModal') closeDatabaseModalDirect();
        }

        function fetchServerFromApi(manual = false) {
            if (manual) {
                alert("Синхронизация через внешнее API успешно выполнена! Статистика серверов и пинг обновлены в реальном времени.");
            }
            // Имитация автообновления онлайна каждые 12 часов
            serversData.forEach(s => {
                const diff = Math.floor(Math.random() * 100) - 40;
                s.online = Math.max(0, s.online + diff);
            });
            renderServers();
        }

        function manageTop() {
            alert("Панель управления Топ игроков из Мстирс активна.");
        }

        // Переключение языка (RU / EN)
        let isEnglish = false;
        function toggleLanguage() {
            isEnglish = !isEnglish;
            if (isEnglish) {
                document.getElementById('page-title').textContent = "World Minecraft Server Monitoring + Profiles & Charts";
                document.getElementById('main-title').textContent = "🌸 World Minecraft Server Monitoring";
                document.getElementById('main-subtitle').textContent = "Monitoring, versions, community forum and top PvP fighters";
                document.getElementById('regions-label').textContent = "Regions:";
                document.getElementById('btn-reset-text').textContent = "Reset Filters (Show All)";
                document.getElementById('search-input').placeholder = "🔍 Search server by name, version or IP...";
            } else {
                document.getElementById('page-title').textContent = "Мировой мониторинг серверов Minecraft + Профили и Графики";
                document.getElementById('main-title').textContent = "🌸 Мировой мониторинг серверов Minecraft";
                document.getElementById('main-subtitle').textContent = "Мониторинг, версии, форум сообщества и топ PvP бойцов";
                document.getElementById('regions-label').textContent = "Регионы:";
                document.getElementById('btn-reset-text').textContent = "Сбросить фильтры (Показать все)";
                document.getElementById('search-input').placeholder = "🔍 Найти сервер по названию, версии или IP...";
            }
        }
    </script>
</body>
</html>
