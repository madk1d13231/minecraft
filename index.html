<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мировой мониторинг серверов Minecraft</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-pink: #ff7b72;
            --vip-gold: #f0883e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .sakura-petal {
            position: fixed;
            background: linear-gradient(135deg, #ffb7c5, #ff69b4);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 24px; color: var(--accent-blue); display: flex; align-items: center; gap: 10px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

        .btn {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background-color: #30363d; border-color: #8b949e; }
        .btn-primary { background-color: #238636; color: white; border-color: #2ea043; }
        .btn-primary:hover { background-color: #2ea043; }

        .filters-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
        }
        .search-box:focus { outline: none; border-color: var(--accent-blue); }

        .filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

        .servers-grid { display: flex; flex-direction: column; gap: 15px; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            transition: 0.2s;
            cursor: pointer;
        }
        .card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .vip-card { border-left: 4px solid var(--vip-gold); }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 18px; color: var(--accent-blue); }

        .badge {
            background: #21262d;
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .rating-star { color: #e3b341; font-weight: bold; }
        p.desc { margin: 8px 0; font-size: 13px; color: var(--text-muted); }

        .beginner-hint {
            background: rgba(88, 166, 255, 0.08);
            border: 1px dashed var(--accent-blue);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-color);
            margin: 10px 0;
        }

        .main-grid { display: grid; grid-template-columns: 1fr 360px; gap: 25px; }
        @media (max-width: 950px) { .main-grid { grid-template-columns: 1fr; } }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .sidebar-card h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; color: var(--accent-blue); }

        .tier-item { background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .tier-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 4px; }
        .rank-badge { font-weight: bold; padding: 1px 6px; border-radius: 4px; }
        .r-gm { background: #f0883e33; color: #f0883e; }
        .r-master { background: #58a6ff33; color: #58a6ff; }
        .r-ace { background: #3fb95033; color: #3fb950; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%; max-width: 650px;
            padding: 25px; border-radius: 10px;
            max-height: 90vh; overflow-y: auto;
        }
        .chart-wrapper { position: relative; height: 250px; width: 100%; margin-top: 15px; }

        #copy-toast {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--accent-green); color: #fff;
            padding: 10px 20px; border-radius: 6px; display: none;
            z-index: 20000; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>🌸 Мировой мониторинг серверов Minecraft</h1>
                <div class="subtitle">Лучшие игровые проекты и глобальный PvP Tier List</div>
            </div>
            <div>
                <button class="btn" onclick="checkAdmin()">⚙️ Админ</button>
            </div>
        </header>

        <div id="section-servers">
            <div class="filters-panel">
                <input type="text" id="search-input" class="search-box" placeholder="🔍 Найти сервер по названию или IP..." oninput="handleSearch()">
                <div class="filter-group">
                    <button class="btn" onclick="filterByMode('Анархия')">🔥 Анархия</button>
                    <button class="btn" onclick="filterByMode('BedWars')">🛏️ BedWars</button>
                    <button class="btn" onclick="filterByMode('Выживание')">🌲 Выживание</button>
                    <button class="btn" onclick="filterByMode('Скайблок')">☁️ Скайблок</button>
                    <button class="btn" onclick="filterByMode('PvP')">⚔️ PvP</button>
                    <button class="btn" style="background: #30363d; border-color: var(--accent-pink); color: var(--accent-pink);" onclick="resetFilters()">🔄 Сбросить</button>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <button class="btn btn-primary" id="add-server-btn" style="display: none;" onclick="openServerForm()">➕ Добавить сервер</button>
            </div>

            <div class="main-grid">
                <div>
                    <div id="server-list" class="servers-grid"></div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3>🏆 Мировой PvP Tier List</h3>
                        <div id="tier-list-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-server-profile" style="display: none;">
            <button class="btn" onclick="goBackToList()" style="margin-bottom: 15px;">⬅️ Назад к списку</button>
            <div class="card" id="profile-content-box"></div>
        </div>
    </div>

    <!-- Модальное окно добавления -->
    <div class="modal" id="serverFormModal" onclick="closeFormModal(event)">
        <div class="modal-content">
            <h3 style="color: var(--accent-blue); margin-top: 0;">Добавить новый сервер</h3>
            <form id="serverEditForm" onsubmit="saveServerForm(event)">
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 12px; color: var(--text-muted);">Название сервера</label>
                    <input type="text" id="f-name" class="search-box" style="width: 100%; box-sizing: border-box; margin-top: 4px;" required>
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 12px; color: var(--text-muted);">IP адрес</label>
                    <input type="text" id="f-ip" class="search-box" style="width: 100%; box-sizing: border-box; margin-top: 4px;" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div>
                        <label style="font-size: 12px; color: var(--text-muted);">Режим</label>
                        <input type="text" id="f-mode" class="search-box" style="width: 100%; box-sizing: border-box; margin-top: 4px;" value="Анархия" required>
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--text-muted);">Подсказка для новичков</label>
                        <input type="text" id="f-hint" class="search-box" style="width: 100%; box-sizing: border-box; margin-top: 4px;" value="Режим без правил и приватов." required>
                    </div>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 12px; color: var(--text-muted);">Описание</label>
                    <textarea id="f-desc" class="search-box" style="width: 100%; height: 70px; box-sizing: border-box; margin-top: 4px; resize: none;" required></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn" onclick="closeFormModalDirect()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div id="copy-toast">IP адрес скопирован в буфер обмена!</div>

                const size = Math.random() * 8 + 8;
                petal.style.width = size + 'px';
                petal.style.height = (size * 0.6) + 'px';
                petal.style.animationDuration = (Math.random() * 6 + 6) + 's';
                petal.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(petal);

            { id: 23, name: "PvPLegends", ip: "play.pvplegends.com", version: "1.8 - 1.20", region: "Европа", flag: "🇪🇺", mode: "PvP", beginnerHint: "💡 Для новичков: арены, тренировка стрельбы из лука и мечей.", status: "🟢 Работает", vip: false, online: 720, maxOnline: 1200, rating: 4.5, desc: "Современные PvP арены и рейтинговые матчи.", history: [680, 700, 710, 715, 720] },
            { id: 24, name: "PixelBlock", ip: "play.pixelblock.ru", version: "1.16 - 1.20", region: "СНГ", flag: "🇷🇺", mode: "BedWars", beginnerHint: "💡 Для новичков: мини-игры и быстрые командные баталии.", status: "🟢 Работает", vip: false, online: 540, maxOnline: 1000, rating: 4.2, desc: "Удобный мини-игровой сервер для СНГ.", history: [500, 520, 530, 535, 540] },
            { id: 25, name: "HardcoreMC", ip: "play.hardcore.su", version: "1.20", region: "СНГ", flag: "🇷🇺", mode: "Выживание", beginnerHint: "💡 Для новичков: одна жизнь на сервере, бан при смерти на 24 часа.", status: "🟢 Работает", vip: false, online: 310, maxOnline: 500, rating: 4.7, desc: "Суровое хардкорное выживание для опытных.", history: [280, 295, 305, 308, 310] },
            { id: 26, name: "NexusAnarchy", ip: "play.nexus.su", version: "1.16 - 1.20", region: "СНГ", flag: "🇷🇺", mode: "Анархия", beginnerHint: "💡 Для новичков: динамичная анархия с частыми бонусами для новичков.", status: "🟢 Работает", vip: false, online: 1820, maxOnline: 2500, rating: 4.6, desc: "Сервер сбалансированной анархии и кланов.", history: [1700, 1750, 1790, 1800, 1820] }
        ];

        let tierListData = [
            { rank: 1, name: "Marlowww", title: "Combat Grandmaster", points: 450, region: "NA", classType: "r-gm" },
            { rank: 2, name: "ItzRealMe", title: "Combat Master", points: 330, region: "NA", classType: "r-master" },
            { rank: 3, name: "coldified", title: "Combat Master", points: 326, region: "EU", classType: "r-master" },
            { rank: 4, name: "Swight", title: "Combat Master", points: 290, region: "NA", classType: "r-master" },
            { rank: 5, name: "janekv", title: "Combat Master", points: 260, region: "EU", classType: "r-master" }
        ];

        let currentFilterMode = '';
        let currentSearchQuery = '';
        let isAdmin = false;
        let onlineChartInstance = null;

        function renderServers() {
            const container = document.getElementById('server-list');
            container.innerHTML = '';

            let filtered = serversData.filter(s => {
                let matchMode = currentFilterMode ? s.mode === currentFilterMode : true;
                let matchSearch = currentSearchQuery ? (
                    s.name.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    s.ip.toLowerCase().includes(currentSearchQuery.toLowerCase())
                ) : true;
                return matchMode && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center; color: var(--text-muted);">Серверы не найдены.</div>`;
                return;
            }

            filtered.forEach(s => {
                const card = document.createElement('div');
                card.className = s.vip ? 'card vip-card' : 'card';
                card.onclick = (e) => {
                    if (!e.target.classList.contains('copy-btn')) openServerProfile(s.id);
                };

                card.innerHTML = `
                    <div class="header-flex">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <h3>${s.name}</h3>
                            ${s.vip ? '<span class="badge" style="background: #f0883e22; color: #f0883e; border: 1px solid #f0883e55;">👑 VIP</span>' : ''}
                            <span class="badge">${s.flag} ${s.region}</span>
                            <span class="badge" style="background: #1f6feb22; color: var(--accent-blue);">${s.mode}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="rating-star">⭐ ${s.rating}</span>
                        </div>
                    </div>
                    <p style="color: var(--text-muted); font-size: 13px; margin: 6px 0;">IP: <code style="color: var(--accent-blue); cursor: pointer;" onclick="copyIp('${s.ip}')">${s.ip}</code></p>
                    <p class="desc">${s.desc}</p>
                    
                    <div class="beginner-hint">${s.beginnerHint}</div>

                    <div class="header-flex" style="margin-top: 10px; margin-bottom: 0; font-size: 12px; color: var(--text-muted);">
                        <span>Версия: <strong style="color: var(--text-color);">${s.version}</strong></span>
                        <span>Онлайн: <strong style="color: var(--accent-green);">${s.online.toLocaleString()}</strong> / ${s.maxOnline.toLocaleString()}</span>
                        ${isAdmin ? `<div><button onclick="deleteServer(${s.id})" style="background: var(--accent-pink); border: none; color: white; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">🗑️ Удал.</button></div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyIp(ip) {
            navigator.clipboard.writeText(ip);
            const toast = document.getElementById('copy-toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('search-input').value;
            renderServers();
        }

        function filterByMode(mode) {
            currentFilterMode = currentFilterMode === mode ? '' : mode;
            renderServers();
        }

        function resetFilters() {
            currentFilterMode = '';
            currentSearchQuery = '';
            document.getElementById('search-input').value = '';
            renderServers();
        }

        function openServerProfile(id) {
            const server = serversData.find(s => s.id === id);
            if (!server) return;

            document.getElementById('section-servers').style.display = 'none';
            document.getElementById('section-server-profile').style.display = 'block';

            const box = document.getElementById('profile-content-box');
            box.innerHTML = `
                <h2 style="color: var(--accent-blue); margin-top: 0;">${server.name}</h2>
                <p style="color: var(--text-muted);">${server.desc}</p>
                <div class="beginner-hint" style="margin: 15px 0;">${server.beginnerHint}</div>
                <p style="font-size: 14px;">IP адрес: <strong style="color: var(--accent-blue); cursor: pointer;" onclick="copyIp('${server.ip}')">${server.ip} 📋</strong></p>
                
                <h3 style="margin-top: 25px; color: var(--text-color);">📈 Динамика онлайна</h3>
                <div class="chart-wrapper">
                    <canvas id="serverOnlineChart"></canvas>
                </div>
            `;

            const ctx = document.getElementById('serverOnlineChart').getContext('2d');
            if (onlineChartInstance) onlineChartInstance.destroy();
            onlineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['12:00', '15:00', '18:00', '21:00', 'Сейчас'],
                    datasets: [{
                        label: 'Игроков онлайн',
                        data: server.history,
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#c9d1d9' } } },
                    scales: {
                        x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                        y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
                    }
                }
            });
        }

        function goBackToList() {
            document.getElementById('section-server-profile').style.display = 'none';
            document.getElementById('section-servers').style.display = 'block';
            if (onlineChartInstance) onlineChartInstance.destroy();
        }

        function renderTierList() {
            const list = document.getElementById('tier-list-container');
            list.innerHTML = '';
            tierListData.forEach(player => {
                const item = document.createElement('div');
                item.className = 'tier-item';
                item.innerHTML = `
                    <div class="tier-header">
                        <span><strong class="rank-badge ${player.classType}">#${player.rank}</strong> <strong>${player.name}</strong></span>
                        <span class="badge" style="background: #1f6feb22; color: var(--accent-blue);">${player.region}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 12px; margin-top: 4px;">
                        <span>${player.title}</span>
                        <span style="color: var(--accent-green); font-weight: bold;">${player.points} pts</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function checkAdmin() {
            const pass = prompt("Введите пароль администратора:");
            if (pass === "qwe12345tyu124") {
                isAdmin = !isAdmin;
                document.getElementById('add-server-btn').style.display = isAdmin ? 'inline-block' : 'none';
                renderServers();
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        function openServerForm() { document.getElementById('serverFormModal').style.display = 'flex'; }
        function closeFormModalDirect() { document.getElementById('serverFormModal').style.display = 'none'; }
        function closeFormModal(e) { if (e.target.id === 'serverFormModal') closeFormModalDirect(); }

        function saveServerForm(e) {
            e.preventDefault();
            const name = document.getElementById('f-name').value;
            const ip = document.getElementById('f-ip').value;
            const mode = document.getElementById('f-mode').value;
            const beginnerHint = "💡 Для новичков: " + document.getElementById('f-hint').value;
            const desc = document.getElementById('f-desc').value;

            serversData.unshift({
                id: Date.now(),
                name, ip, version: "1.20", region: "СНГ", flag: "🇷🇺",
                mode, beginnerHint, status: "🟢 Работает", vip: false,
                online: 500, maxOnline: 1000, rating: 4.5,
                desc, history: [300, 400, 500]
            });
            closeFormModalDirect();
            renderServers();
        }

        function deleteServer(id) {
            if (confirm("Удалить сервер?")) {
                serversData = serversData.filter(s => s.id !== id);
                renderServers();
            }
        }
    </script>
</body>
</html>
