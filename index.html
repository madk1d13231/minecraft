<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг серверов и Топ PvP</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .content-section {
            flex: 1;
        }
        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaa;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .controls input, .controls select {
            padding: 10px 12px;
            background: #252525;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }
        .controls input {
            flex-grow: 1;
        }
        .server-card {
            background: #252525;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .server-title {
            color: #ff9800;
            font-size: 20px;
            margin: 0 0 10px 0;
        }
        .server-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .server-card p {
            margin: 6px 0;
            font-size: 14px;
        }
        
        /* Правая колонка с рейтингом MCTiers */
        .sidebar-leaderboard {
            width: 380px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }
        .sidebar-leaderboard h3 {
            color: #ff9800;
            border-bottom: 2px solid #ff9800;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 16px;
        }
        .player-row {
            display: flex;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #333;
            font-size: 13px;
            gap: 8px;
        }
        .rank {
            font-weight: bold;
            color: #ff9800;
            width: 22px;
        }
        .name {
            flex-grow: 1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tiers {
            display: flex;
            gap: 3px;
        }
        .tier-tag {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
            background: #444;
            color: #fff;
        }
        .admin-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
        }
        .admin-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>

    <button class="admin-btn" onclick="checkAdmin()">Админ</button>

    <div class="main-layout">
        <!-- Левая часть: Мониторинг серверов, поиск и фильтры -->
        <div class="content-section">
            <h1>Мониторинг серверов Minecraft</h1>
            <p class="subtitle">Список лучших серверов со всего мира</p>

            <div class="controls">
                <input type="text" id="searchServer" placeholder="Поиск сервера по названию или IP...">
                <select id="filterCountry">
                    <option value="all">Все регионы</option>
                    <option value="СНГ">СНГ</option>
                    <option value="США">США</option>
                    <option value="Европа">Европа</option>
                </select>
            </div>

            <div id="server-list"></div>
        </div>

        <!-- Правая колонка: Топ-20 игроков MCTiers -->
        <div class="sidebar-leaderboard">
            <h3>🏆 Топ-20 PvP Игроков</h3>
            <div id="leaderboard"></div>
        </div>
    </div>

            { name: "FunTime", ip: "funtime.su", region: "СНГ", flag: "RU", rating: 4.6, online: 4200, mode: "Гриф / Анархия", desc: "Один из самых известных анархических серверов СНГ." },[cite: 3]

            { name: "DexLand", ip: "play.dexland.su", region: "СНГ", flag: "RU", rating: 4.4, online: 600, mode: "Выживание / Гриф", desc: "Уютный сервер с экономикой и кланами." },[cite: 3]
            { name: "Hypixel", ip: "play.hypixel.net", region: "США", flag: "us", rating: 5.0, online: 48500, mode: "BedWars / SkyBlock", desc: "Крупнейший мировой сервер с огромным онлайном и мини-играми." },[cite: 3]
            { name: "Purple Prison", ip: "purpleprison.net", region: "США", flag: "us", rating: 4.8, online: 2100, mode: "Prison / Economy", desc: "Легендарная тюрьма с развитой экономикой и шахтами." },[cite: 3]
            { name: "VeltMC", ip: "hub.velt.pvp", region: "США", flag: "us", rating: 4.6, online: 1500, mode: "Factions / Practice", desc: "Классический PvP сервер для тренировок и клановых войн." },[cite: 3]

        const pvpLeaders = [

        ];

        // Отрисовка серверов
        function renderServers(filterText = "", filterRegion = "all") {
            let list = document.getElementById("server-list");
            if (!list) return;

            let filtered = servers.filter(s => {
                let matchesText = s.name.toLowerCase().includes(filterText) || s.ip.toLowerCase().includes(filterText);
                let matchesRegion = (filterRegion === "all" || s.region === filterRegion);
                return matchesText && matchesRegion;
            });

            list.innerHTML = filtered.map(s => `
                <div class="server-card">
                    <div class="server-header">
                        <h2 class="server-title">${s.name}</h2>
                        <span class="server-badge">⭐ ${s.rating} (${s.flag} ${s.region})</span>
                    </div>
                    <p><strong>IP:</strong> ${s.ip}</p>
                    <p><strong>Режим:</strong> ${s.mode} | <strong>Онлайн:</strong> ${s.online}</p>
                    <p>${s.desc}</p>
                </div>
            `).join("");
        }

        // Отрисовка топ-20 игроков справа
        const leaderboardContainer = document.getElementById('leaderboard');
        if (leaderboardContainer) {
            pvpLeaders.forEach(p => {
                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `<span class="rank">${p.rank}.</span>
                                 <span class="name">${p.name}</span>
                                 <div class="tiers">${p.tiers.map(t => `<span class="tier-tag">${t}</span>`).join('')}</div>`;
                leaderboardContainer.appendChild(row);
            });
        }

        // События для поиска и фильтрации
        document.getElementById("searchServer").addEventListener("input", (e) => {
            let text = e.target.value.toLowerCase();
            let region = document.getElementById("filterCountry").value;
            renderServers(text, region);
        });

        document.getElementById("filterCountry").addEventListener("change", (e) => {
            let region = e.target.value;
            let text = document.getElementById("searchServer").value.toLowerCase();
            renderServers(text, region);
        });

        // Проверка пароля администратора[cite: 3]
        function checkAdmin() {
            let pass = prompt("Введите пароль администратора:");[cite: 3]
            if (pass === PASSWORD) {[cite: 3]
                alert("Успешный вход в режим администратора!");[cite: 3]
            } else if (pass !== null) {[cite: 3]
                alert("Неверный пароль!");[cite: 3]
            }
        }

        // Инициализация при загрузке
        renderServers();
    </script>
</body>
</html>
